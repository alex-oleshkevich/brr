<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Connect an agent · brr</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e4e4e7;
    --text: #18181b;
    --text-secondary: #52525b;
    --text-tertiary: #6b6b75;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-subtle: #eef2ff;
    --accent-text: #4338ca;
    --ring: rgba(79, 70, 229, 0.35);
    --shadow: 0 1px 3px rgba(9, 9, 11, 0.06), 0 16px 48px rgba(9, 9, 11, 0.1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b;
      --surface: #111114;
      --border: #232328;
      --text: #fafafa;
      --text-secondary: #a1a1aa;
      --text-tertiary: #8b8b94;
      --accent: #5b5bd6;
      --accent-hover: #6461e6;
      --accent-subtle: #1e1b4b;
      --accent-text: #a5b4fc;
      --ring: rgba(165, 180, 252, 0.4);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 48px rgba(0, 0, 0, 0.5);
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(60rem 30rem at 50% -10%, var(--accent-subtle), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 14px/1.5 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 400px;
    padding: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }

  .link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .tile {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-secondary);
  }

  .tile.brr {
    border-color: transparent;
    background: var(--accent);
    color: #ffffff;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.02em;
  }

  .dots {
    display: flex;
    gap: 4px;
  }

  .dots span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--border);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-align: center;
  }

  .lead {
    margin: 0 0 24px;
    color: var(--text-secondary);
    text-align: center;
  }

  ul {
    margin: 0 0 24px;
    padding: 16px;
    list-style: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    display: grid;
    gap: 12px;
  }

  li {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    color: var(--text-secondary);
  }

  li svg {
    flex: none;
    margin-top: 2px;
    color: var(--accent-text);
  }

  button {
    width: 100%;
    height: 40px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #ffffff;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 120ms ease, box-shadow 120ms ease;
  }

  button:hover {
    background: var(--accent-hover);
  }

  button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--ring);
  }

  .note {
    margin: 16px 0 0;
    color: var(--text-tertiary);
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <div class="link" aria-hidden="true">
    <div class="tile">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 14h.01M15 14h.01M2 13v2M22 13v2"/></svg>
    </div>
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="tile brr">brr</div>
  </div>

  <h1>Connect an agent</h1>
  <p class="lead">An AI agent wants to use this brr.</p>

  <ul>
    <li>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Launch and drive browsers and their tabs
    </li>
    <li>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Use your Profiles, including their logins
    </li>
    <li>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Read pages, take screenshots, save files
    </li>
  </ul>

  <form method="post">
    <button type="submit" autofocus>Allow</button>
  </form>
  <p class="note">Close this tab to cancel.</p>
</main>
</body>
</html>
