<!doctype html>
<html>
<head><meta charset="utf-8"><title>big</title>
<style>canvas { display: block; width: 600px; height: 600px; page-break-after: always; }</style></head>
<body>
<script>
for (let i = 0; i < 6; i++) {
  const canvas = document.createElement('canvas');
  canvas.width = 2000;
  canvas.height = 2000;
  const context = canvas.getContext('2d');
  const image = context.createImageData(2000, 2000);
  const view = new Uint32Array(image.data.buffer);
  for (let p = 0; p < view.length; p++) view[p] = (Math.random() * 0xffffffff) | 0xff000000;
  context.putImageData(image, 0, 0);
  document.body.appendChild(canvas);
}
</script>
</body>
</html>
